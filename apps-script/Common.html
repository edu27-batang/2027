<script>
/* 바탕화면 공통 스크립트 — 서버 호출, 화면 도우미(버튼 기다림·창·휴대폰 뒤로), 로고·아이콘 */

/*
 * 서버 호출. 어디서 열렸는지에 따라 알아서 고른다.
 *  1) Apps Script 웹앱 안: google.script.run.api(name, payload)
 *  2) 미리보기·테스트: window.LocalApi(name, payload)
 *  3) GitHub Pages: config.js의 BATANG_API(…/exec)로 fetch POST.
 *     Content-Type을 text/plain으로 보내야 브라우저 사전 확인(preflight) 없이 Apps Script와 통신된다.
 */
var CALL_TIMEOUT_MS = 40000;
function call(name, payload) {
  payload = payload || {};
  var done = function (r) {
    if (r && r.ok) return r.data;
    var e = new Error((r && r.error) || '잠시 문제가 생겼어요.'); if (r && r.auth) e.auth = true; throw e;
  };
  if (window.google && google.script && google.script.run) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (r) { try { resolve(done(r)); } catch (e) { reject(e); } })
        .withFailureHandler(function () { reject(new Error('연결이 불안정해요. 다시 시도해 주세요.')); })
        .api(name, payload);
    });
  }
  if (window.LocalApi) {
    return new Promise(function (res) { setTimeout(res, 260); }).then(function () { return done(window.LocalApi(name, payload)); });
  }
  var url = window.BATANG_API || '';
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url) && !window.BATANG_API_DEV) {
    return Promise.reject(new Error('서버 주소가 설정되지 않았어요. 학생회에 알려 주세요.'));
  }
  var ctrl = window.AbortController ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, CALL_TIMEOUT_MS) : null;
  return fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ name: name, payload: payload }),
    credentials: 'omit', redirect: 'follow', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined
  }).then(function (res) {
    return res.text().then(function (text) {
      try { return JSON.parse(text); } catch (e) { throw new Error('서버 응답을 읽을 수 없어요. 잠시 뒤 다시 시도해 주세요.'); }
    });
  }, function (err) {
    if (err && err.name === 'AbortError') throw new Error('응답이 늦어요. 다시 시도해 주세요.');
    throw new Error('연결이 불안정해요. 다시 시도해 주세요.');
  }).then(function (r) { if (timer) clearTimeout(timer); return done(r); },
    function (e) { if (timer) clearTimeout(timer); throw e; });
}

function $(s, el) { return (el || document).querySelector(s); }
function $$(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
/* onclick="f('…')"처럼 HTML 속성 안의 JS 문자열에 넣을 값. esc만 쓰면 브라우저가 &#39;를 '로 되돌려 문자열이 깨진다 */
function jsq(s) { return esc(String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/[\r\n\u2028\u2029]/g, ' ')); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

var toastTimer;
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2800);
}

/* 버튼 기다림 표시. 큰 카드 버튼(.big·.pill-btn 등)은 내용을 지우지 않고 크기를 그대로 둔 채 빙글 표시만 얹는다. */
function busy(btn, on) {
  if (!btn) return;
  var keep = !btn.classList.contains('btn');
  if (on) {
    if (keep) { btn.classList.add('busy'); btn.setAttribute('aria-busy', 'true'); btn.disabled = true; return; }
    btn.style.minWidth = btn.offsetWidth + 'px';
    btn.dataset.label = btn.innerHTML; btn.innerHTML = ''; btn.classList.add('loading'); btn.disabled = true;
  } else {
    if (keep) { btn.classList.remove('busy'); btn.removeAttribute('aria-busy'); btn.disabled = false; return; }
    btn.innerHTML = btn.dataset.label || btn.innerHTML; btn.classList.remove('loading'); btn.disabled = false; btn.style.minWidth = '';
  }
}

/* ── 부드러운 전환 ── */
function reduceMotion() { return !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); }
/* 열린 창(overlay) 목록. 휴대폰 '뒤로'를 누르면 맨 위 창부터 닫힌다. */
var OVERLAYS = [];
function openOverlay(m, onClose) {
  m._onClose = onClose || null;
  OVERLAYS.push(m);
  document.body.appendChild(m);
  document.body.classList.add('locked');
  return m;
}
/* 창(overlay)을 바로 지우지 않고 살짝 내려가며 사라지게 */
function closeOverlay(m) {
  if (!m || !m.parentNode || m.classList.contains('closing')) return;
  var i = OVERLAYS.indexOf(m); if (i >= 0) OVERLAYS.splice(i, 1);
  if (!OVERLAYS.length) document.body.classList.remove('locked');
  if (m.id) m.removeAttribute('id');
  var cb = m._onClose; m._onClose = null;
  if (cb) cb();
  if (reduceMotion()) return m.remove();
  m.classList.add('closing'); m.style.pointerEvents = 'none';
  setTimeout(function () { m.remove(); }, 200);
}
function closeTopOverlay() { var m = OVERLAYS[OVERLAYS.length - 1]; if (!m) return false; closeOverlay(m); return true; }

/*
 * 휴대폰 '뒤로'(안드로이드 뒤로 버튼·아이폰 밀어서 뒤로)를 앱 안의 뒤로로 쓴다.
 * 방문 기록에 한 칸을 더 쌓아 두고, 뒤로가 오면 앱이 처리한 뒤 다시 쌓는다.
 * handler()가 false면 첫 화면이다: 한 번 더 누르면 나간다.
 */
function installBackTrap(handler) {
  if (window.google && google.script) return; // Apps Script 안(iframe)에서는 쓰지 않는다
  try {
    history.replaceState({ bth: 0 }, '');
    history.pushState({ bth: 1 }, '');
  } catch (e) { return; }
  var lastRoot = 0;
  window.addEventListener('popstate', function (e) {
    if (e.state && e.state.bth === 1) return; // 앞으로 가기
    var rearm = function () { try { history.pushState({ bth: 1 }, ''); } catch (x) { } };
    if (closeTopOverlay() || handler()) return rearm();
    if (Date.now() - lastRoot < 2200) { history.back(); return; }
    lastRoot = Date.now(); rearm();
    toast('한 번 더 누르면 바탕화면을 나가요');
  });
}

/* 지금 화면을 복사해 위에 얹고 흐리게 내보낸다. 새 화면은 그 아래에서 바로 그려지므로 코드 흐름은 그대로다. */
function ghostOut(el, back) {
  if (reduceMotion() || !el || !el.firstElementChild) return;
  var prev = document.getElementById('navGhost'); if (prev) prev.remove();
  var r = el.getBoundingClientRect();
  var wrap = document.createElement('div'); wrap.id = 'navGhost'; wrap.className = 'nav-ghost' + (back ? ' back' : '');
  wrap.setAttribute('aria-hidden', 'true');
  var c = el.cloneNode(true); c.removeAttribute('id');
  Array.prototype.forEach.call(c.querySelectorAll('[id]'), function (x) { x.removeAttribute('id'); });
  c.style.cssText = 'position:absolute;margin:0;left:' + r.left + 'px;width:' + r.width + 'px;top:' + r.top + 'px';
  wrap.appendChild(c); document.body.appendChild(wrap);
  setTimeout(function () { wrap.remove(); }, 320);
}

/* 화면 안 확인 창 (confirm 대신) */
function ask(title, desc, okLabel) {
  return new Promise(function (resolve) {
    var m = document.createElement('div'); m.className = 'overlay';
    m.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><b style="font-size:19px;display:block">' + esc(title) + '</b>' +
      (desc ? '<p class="lead" style="margin:8px 0 0">' + esc(desc) + '</p>' : '') +
      '<div class="row" style="margin-top:20px"><button class="btn soft" data-v="0">아니요</button><button class="btn primary" data-v="1">' + esc(okLabel || '확인') + '</button></div></div>';
    var answer = false;
    m.onclick = function (e) {
      var b = e.target.closest('[data-v]');
      if (b || e.target === m) { answer = !!(b && b.dataset.v === '1'); closeOverlay(m); }
    };
    openOverlay(m, function () { resolve(answer); });
  });
}

var store = {
  get: function (k) { try { return JSON.parse(localStorage.getItem('bth_' + k) || 'null'); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem('bth_' + k, JSON.stringify(v)); } catch (e) { } }
};

/* 로고: logos.js(Apps Script에선 Logos.html)의 LOGO_HWAMYEON('바탕화면' 글자) / LOGO_CIRCLE(동그라미) */
function logoHw(w, cls) { return '<img class="logo-hw' + (cls ? ' ' + cls : '') + '" src="' + (window.LOGO_HWAMYEON || '') + '" alt="바탕화면" width="' + w + '" style="width:' + w + 'px" decoding="async">'; }
function logoCircle(size) { return '<img src="' + (window.LOGO_CIRCLE || '') + '" alt="바탕" width="' + size + '" height="' + size + '" style="display:block">'; }

/* 사진을 휴대폰에서 줄여서 보낸다: 긴 변 1600px, JPEG 80% */
function shrinkPhoto(file) {
  return new Promise(function (resolve, reject) {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('사진 파일만 올릴 수 있어요.'));
    var fr = new FileReader();
    fr.onerror = function () { reject(new Error('사진을 읽을 수 없어요.')); };
    fr.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error('이 사진 형식은 열 수 없어요. 다른 사진을 골라 주세요.')); };
      img.onload = function () {
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.8));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* 타앙이: assets의 TAANG[name] (default, hello, guide, point, surprised, success, thinking, sorry, loading, thanks, book, letter, room) */
function taang(name, w, cls) {
  var src = (window.TAANG || {})[name] || (window.TAANG || {})['default'] || '';
  return '<img class="taang' + (cls ? ' ' + cls : '') + '" src="' + src + '" alt="" aria-hidden="true" width="' + w + '" height="' + Math.round(w * 560 / 720) + '">';
}

/* 사용 설명서(? 아이콘). sections: [{key, title, html}], getWhere: 지금 화면 이름(버그 신고에 붙는다) */
var HELP = null;
function setupHelp(getSections, getOpenKey, getWhere) { HELP = { sections: getSections, openKey: getOpenKey, where: getWhere }; }
function helpBtn() { return '<button class="icon-btn help-btn" aria-label="사용 설명서" onclick="openHelp()">?</button>'; }
function openHelp() {
  if (!HELP) return;
  var secs = HELP.sections(), open = HELP.openKey ? HELP.openKey() : '';
  var m = document.createElement('div'); m.className = 'overlay help';
  m.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="사용 설명서">' +
    '<div class="help-head">' + taang('guide', 56) + '<div class="grow"><b>타앙이의 사용 설명서</b><small>궁금한 곳을 눌러 보세요</small></div>' +
    '<button class="icon-btn" aria-label="닫기" data-x>' + I.close + '</button></div>' +
    secs.map(function (s) {
      return '<details class="help-sec"' + (s.key === open ? ' open' : '') + '><summary>' + s.title + '</summary><div class="help-body"><div class="help-in">' + s.html + '</div></div></details>';
    }).join('') +
    '<div class="bug">' + taang('sorry', 64) + '<div class="grow"><b>오류·버그 신고</b><small>이상한 점을 적어 주면 학생회에 바로 전해져요. 이름은 저장하지 않아요.</small></div></div>' +
    '<label class="field" style="margin:10px 0 8px"><textarea id="bugText" maxlength="1000" style="min-height:96px" placeholder="예: 반납하기에서 물품을 눌러도 선택이 안 돼요"></textarea></label>' +
    '<div class="row" style="justify-content:flex-end"><span class="grow bug-done" id="bugDone"></span><button class="btn sm primary" id="bugBtn">보내기</button></div>' +
    '</div>';
  m.onclick = function (e) { if (e.target === m || e.target.closest('[data-x]')) closeOverlay(m); };
  m.querySelectorAll('.help-sec summary').forEach(function (sm) { sm.addEventListener('click', function (e) { e.preventDefault(); toggleSec(sm.parentNode); }); });
  m.querySelector('#bugBtn').onclick = function () { sendBug(this, HELP.where ? HELP.where() : ''); };
  openOverlay(m);
  var o = m.querySelector('details[open]'); if (o) setTimeout(function () { o.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 60);
}
/* 설명 펼치기·접기를 높이 애니메이션으로 부드럽게 */
function toggleSec(d) {
  var body = d.querySelector('.help-body');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { d.open = !d.open; return; }
  if (d.dataset.anim) return;
  d.dataset.anim = '1';
  var done = function () { body.style.height = ''; body.style.overflow = ''; delete d.dataset.anim; body.removeEventListener('transitionend', done); };
  body.style.overflow = 'hidden';
  if (!d.open) {
    d.open = true; d.classList.add('opening');
    var h = body.scrollHeight;
    body.style.height = '0px'; body.getBoundingClientRect();
    body.style.height = h + 'px';
    body.addEventListener('transitionend', function f() { body.removeEventListener('transitionend', f); d.classList.remove('opening'); done(); });
    setTimeout(function () { if (d.dataset.anim) { d.classList.remove('opening'); done(); } }, 500);
    setTimeout(function () { d.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 260);
  } else {
    body.style.height = body.scrollHeight + 'px'; body.getBoundingClientRect();
    d.classList.add('closing'); body.style.height = '0px';
    var fin = function () { body.removeEventListener('transitionend', fin); d.open = false; d.classList.remove('closing'); done(); };
    body.addEventListener('transitionend', fin);
    setTimeout(function () { if (d.dataset.anim) fin(); }, 500);
  }
}
function sendBug(btn, where) {
  var t = document.getElementById('bugText'), text = t.value.trim();
  if (text.length < 5) { toast('어떤 문제인지 5자 이상 적어 주세요'); return t.focus(); }
  var ua = navigator.userAgent, dev = /iPhone|iPad/.test(ua) ? 'iPhone/iPad' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : '기타';
  var app = /KAKAOTALK/i.test(ua) ? ' · 카카오톡 앱' : /NAVER/i.test(ua) ? ' · 네이버 앱' : '';
  busy(btn, true);
  call('suggest', { category: '버그 신고', anonymous: true, content: text + '\n\n— 신고한 화면: ' + (where || '알 수 없음') + ' · 기기: ' + dev + app })
    .then(function (r) {
      busy(btn, false); btn.disabled = true; btn.textContent = '보냈어요'; t.value = ''; t.disabled = true;
      var codes = store.get('codes') || []; codes.unshift(r.code); store.set('codes', codes.slice(0, 20));
      document.getElementById('bugDone').textContent = '고마워요! 접수번호 ' + r.code;
    }).catch(function (e) { busy(btn, false); toast(e.message); });
}
/* 하단 고정 버튼이 있는 화면 표시(토스트 위치 등) */
function syncFab() { document.body.classList.toggle('has-bottom', !!document.querySelector('#app .bottom')); }
