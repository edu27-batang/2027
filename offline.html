<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5FBFF">
<title>바탕화면</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F5FBFF;color:#213536;
    font-family:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;text-align:center;padding:24px;box-sizing:border-box;word-break:keep-all}
  img{width:150px;height:auto}
  h1{font-size:22px;margin:12px 0 6px}
  p{color:#5b7172;margin:0 0 22px;line-height:1.6}
  button{height:52px;padding:0 28px;border:0;border-radius:16px;background:#668485;color:#fff;font-size:17px;font-weight:700}
</style>
</head>
<body>
<main>
  <img src="img/taang_sorry.svg" alt="">
  <h1>인터넷 연결을 확인해 주세요</h1>
  <p>연결되면 바로 다시 열 수 있어요.</p>
  <button onclick="location.reload()">다시 열기</button>
</main>
</body>
</html>
